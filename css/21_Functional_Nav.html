<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style type="text/css">
      /* Based on better website http://bettermotherfuckingwebsite.com/ */
      body {
        margin: 0 auto;
        max-width: auto;
        font-family: sans-serif;
        line-height: 1.6em;
        font-size: 18px;
        color: #444;
        background-color: snow;
      }

      main {
        margin: 1em auto;
        padding: 1em;
      }

      a {
        text-decoration: none;
        color: snow;
      }

      /* css-pseudo-class that take affect on when element is selected using (keyboard) */
      a:focus {
        border: solid 2px gold;
      }

      /* css-pseudo-element that add content after the selected element */
      a::after {
        content: " »";
      }

      /* Here we start */
      nav {
        background-color: SeaGreen;
        color: snow;
        display: flex;
        justify-content: space-between;
      }

      nav ul {
        /* Make the markers disappear */
        list-style-type: none;
      }

      nav ul li {
        /* Puts the elements in a single line */
        display: inline-flex;
        margin: 0.3em 1em;
      }

      /* These two lines make the checkbox and the label disappear when we are in desktop mode. */
      nav input[type="checkbox"],
      nav label {
        display: none;
      }

      /* This start to get interesting: we go into mobile phone mode */
      @media (max-width: 576px) {
        /* Here is the magic: if the checkbox is not marked, the adjacent list is not displayed */
        input[type="checkbox"]:not(:checked) + ul {
          display: none;
        }

        nav {
          flex-direction: row;
          flex-wrap: wrap;
          margin-left: 0;
          margin-right: 0;
        }

        /* Stlying the menu icon, the checkbox stays hidden */
        nav label {
          text-align: right;
          display: block;
          padding: 0.5em;
          line-height: 1.6em;
          align-self: center;
        }

        /* Because we are in mobile mode, we want to display it as a vertical list */
        nav ul {
          display: block;
        }

        /* We have two lists: the first one are the always visibile items in the 
        menu bar. The second one is the one that will be hidden */
        nav ul:last-child {
          width: 100%;
          flex-basis: 100%;
        }

        nav ul li {
          margin-bottom: 0;
          width: 100%;
          text-align: right;
          padding: 0.5em;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li>
          <a href="#">GeoNet.com</a>
        </li>
      </ul>

      <!-- magic -->
      <label for="menu" tabindex="0"> 🍔 </label>
      <input id="menu" type="checkbox" />

      <ul>
        <li><a href="#">about</a></li>
        <li><a href="#">contact</a></li>
        <li><a href="#">help</a></li>
      </ul>
    </nav>
  </body>
</html>
