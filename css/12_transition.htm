<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        height: 100vh;
        text-align: center;
      }

      .btn {
        margin-top: 50%;
        width: 150px;
        height: 50px;
        background-color: red;
        font-size: large;
        font-family: fantasy;
        border-radius: 5px;
        transition-property: all;
        transition-duration: 0.7s;
        transition-timing-function: ease-in;
        /* transition:
          transition-property
          transition-duration
          transition-timing-function  ; */
      }

      .btn:hover {
        height: 20px;
        font-size: 6px;
        box-shadow: 50px solid aqua;
        background-color: green;
        color: green;
      }
    </style>
  </head>
  <body>
    <button class="btn">Press me</button>
  </body>
</html>
