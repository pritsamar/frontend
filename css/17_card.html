<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: #121212;
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      div {
        position: relative;
        width: 200px;
        height: 200px;
      }

      .card-container img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        transform-origin: bottom center;
        transition: transform 0.4s ease-in-out;
      }

      /* Initial stacking order */
      .ace1 {
        z-index: 4;
      }
      .ace2 {
        z-index: 3;
      }
      .ace3 {
        z-index: 2;
      }
      .ace4 {
        z-index: 1;
      }

      /* Fan out smoothly when hovering over the container */
      .card-container:hover .ace1 {
        transform: rotate(45deg) translateX(40px);
      }

      .card-container:hover .ace2 {
        transform: rotate(30deg) translateX(30px);
        transition-delay: 0.1s;
      }

      .card-container:hover .ace3 {
        transform: rotate(15deg) translateX(10px);
        transition-delay: 0.2s;
      }

      .card-container:hover .ace4 {
        transform: rotate(5deg) translateX(5px);
        transition-delay: 0.3s;
      }

      /* Optional: highlight card when hovered individually */
      .card-container img:hover {
        z-index: 10;
        /* transform: scale(1.08) translateY(15px) ; */
      }
    </style>
  </head>

  <body>
    <div class="card-container">
      <img class="ace1" src="img/ace1.png" alt="" />
      <img class="ace2" src="img/ace2.png" alt="" />
      <img class="ace3" src="img/ace3.png" alt="" />
      <img class="ace4" src="img/ace4.png" alt="" />
    </div>
  </body>
</html>
