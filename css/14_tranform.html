<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        height: 200px;
        width: 150px;
        background-color: turquoise;
        text-align: center;
        transform: translate(50px, 100px);
        transform: rotate(60deg);
      }

      h1:hover {
        transform: scale(0.5);
        transition: all 0.5 ease;
      }
      .box {
        height: 200px;
        width: 150px;
        border: 2px solid red;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h1>prit</h1>
      <h1 class="h2">prit2</h1>
    </div>
  </body>
</html>
