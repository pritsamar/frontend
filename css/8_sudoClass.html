<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./8_sudoClass.css" />
  </head>

  <body>
    <h1>CSS Pseudo Class</h1>

    <!-- hover and active -->
    <h2>1. Button</h2>
    <button>Hover / Click Me</button>

    <br /><br />
    <!-- disabled -->
    <button disabled>Disabled Button</button>

    <!-- focus,required,enabled -->
    <h2>2. Input</h2>
    <input type="text" placeholder="Required Name" required />

    <br /><br />
    <!-- checked -->
    <h2>3.Checked</h2>
    <input type="checkbox" id="agree" />
    <label for="agree">I Agree</label>

    <!-- first,last,nth - child -->
    <h2>4.Subjects</h2>
    <ul class="subject">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>Bootstrap</li>
      <li>React</li>
    </ul>

    <!-- link and visited -->
    <h2>5. Links</h2>
    <a href="https://www.google.com">Google</a>
  </body>
</html>
