<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .main {
        position: relative;
        border: 2px black solid;

        left: 500px;
        top: 30px;
        width: 500px;
        height: 700px;
      }
      .light {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid black;
        position: relative;
        left: 180px;
        top: 150px;
        margin: 30px;
      }

      .red {
        animation: red 3s linear 0s 1;
      }

      @keyframes red {
        0% {
          background-color: white;
        }
        100% {
          background-color: red;
        }
      }

      .yellow {
        animation: yellow 3s linear 3s 1;
      }

      @keyframes yellow {
        0% {
          background-color: white;
        }
        100% {
          background-color: yellow;
        }
      }

      .green {
        animation: green 3s linear 6s 1;
      }

      @keyframes green {
        0% {
          background-color: white;
        }
        100% {
          background-color: green;
        }
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="light red"></div>
      <div class="light yellow"></div>
      <div class="light green"></div>
    </div>
  </body>
</html>
