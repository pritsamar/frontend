<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h4>Login form</h4>
    <form action="">
      <label for="">User input: </label>
      <input type="text" />
      <br />
      <br />
      <label for="">password: </label>
      <input type="password" />
      <br />
      <br /><br />
      <!-- <input type="submit" /> -->
      <!-- default behavior of submit button is page refresh -->
      <input type="reset" value="reset" />
      <button type="submit">submit</button>
    </form>
    <hr />
    <form action="">
      <fieldset>
        <legend>Student Registration</legend>
        <!--  id in input for in label is use to connect  -->
        <label for="firstname">First Name</label> <br />
        <input type="text" id="firstname" /><br /><br />
        <label for="lastname">Last Name</label> <br />
        <input type="text" id="lastname" /><br /><br />
        <label for="email">Email Name</label> <br />
        <input type="email" id="email" /><br /><br />
        <label for="password">Password</label> <br />
        <input type="password" id="password" /><br /><br />
        <label for="">DOB</label> <br />
        <input type="date" /><br /><br />
        <label for="">Age</label> <br />
        <input type="age" /><br /><br />

        <!-- radio button(single selection): use name attr same value for all  -->
        <label for="radio">Select Your Gender</label> <br />
        <input type="radio" name="gender" id="male" />
        <label for="male">Male</label> <br />
        <input type="radio" name="gender" id="female" />
        <label for="female">Female</label> <br />
        <input type="radio" name="gender" id="others" />
        <label for="others">Others</label> <br />
        <!-- checkBox (multiple selection) -->
        <label for="">Skills</label><br />
        <input type="checkbox" id="mern" /> <label for="mern">MERN</label><br />
        <input type="checkbox" id="" /> <label for="">Python</label><br />
        <input type="checkbox" id="java" /> <label for="java">JAVA</label><br />
        <input type="checkbox" id="" /> <label for="">&dot;NET</label><br />
        <!--  input type url -->
        <label for="site">Github</label>
        <input type="url" />

        <br /><br />

        <label for="">add Resume</label> <br />
        <input type="file" name="" id="" multiple />
        <br /><br />
        <label for="">Comments</label><br />
        <textarea rows="5" cols="30"></textarea>

        <br /><br />

        <label for="range">select range</label>
        <input type="range" name="" id="range" />

        <br /><br />
        <input type="reset" value="reset" />
        <input type="submit" value="submit" />
      </fieldset>
    </form>
  </body>
</html>
