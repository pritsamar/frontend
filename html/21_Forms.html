<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h3>Novell Services Login</h3>
    <form action="">
      <table>
        <tr>
          <td>
            <label for="name">Username: </label>
          </td>
          <td><input type="text" name="" id="name" /></td>
        </tr>
        <tr>
          <td><label for="">Password:</label></td>
          <td><input type="password" /></td>
        </tr>
        <tr>
          <td>
            <label for="">City of <br />Employment:</label>
          </td>
          <td><input type="text" name="" id="" /></td>
        </tr>

        <tr>
          <td>Web server:</td>
          <td>
            <select name="url" id="">
              <option value="">--Choose a server--</option>
              <option value="india">India</option>
              <option value="usa">USA</option>
              <option value="UK">UK</option>
            </select>
          </td>
        </tr>
        <tr></tr>
        <tr></tr>
        <tr></tr>
        <tr></tr>
        <tr></tr>
        <tr></tr>
        <tr></tr>
        <tr></tr>
        <tr></tr>

        <tr>
          <td>
            <label for="radio">
              Please specify <br />
              role</label
            >
          </td>
          <td>
            <input type="radio" name="role" id="admin" />
            <label for="admin">admin</label><br />
            <input type="radio" name="role" id="Engineer" />
            <label for="Engineer">Engineer</label>
            <br />
            <input type="radio" name="role" id="Manager" />
            <label for="Manager">Manager</label>
            <br />
            <input type="radio" name="role" id="Guest" />
            <label for="Guest">Guest</label>
          </td>
        </tr>

        <tr></tr>
        <tr></tr>
        <tr></tr>
        <tr></tr>
        <tr></tr>

        <tr>
          <td>
            <label for=""
              >Single Sign-On <br />
              to The Following:
            </label>
          </td>
          <td>
            <input type="checkbox" name="" id="mail" />
            <label for="mail">Mail</label> <br />
            <input type="checkbox" name="" id="pay" />
            <label for="pay">Payroll</label> <br />
            <input type="checkbox" name="" id="self" />
            <label for="self">Self-Service</label>
          </td>
        </tr>

        <tr></tr>
        <tr></tr>
        <tr></tr>
        <tr>
          <td></td>
          <td>
            <input type="submit" value="Login" />
            <input type="reset" value="Reset" />
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
