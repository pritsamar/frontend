<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .body {
        background-color: antiquewhite;
      }

      .container {
        display: grid;
        gap: 20px;
        grid-template-columns: 1fr 2f 1fr;
        grid-template-rows: 90px 150px 100px 0 100px;

        color: white;
        font-size: large;
        text-align: center;
      }

      .box {
        background-color: #445566;
      }

      .box1 {
        grid-row: 1/2;
        grid-column: 1/4;
      }

      .box2 {
        grid-row: 2/4;
        grid-column: 1/2;
      }

      .box9 {
        grid-row: 5/6;
        grid-column: 1/4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box box1">Header</div>
      <div class="box box2">SideBar</div>
      <div class="box box3">card</div>
      <div class="box box4">card</div>
      <div class="box box5">card</div>
      <div class="box box6">card</div>

      <div class="box box9">footer</div>
    </div>
  </body>
</html>
