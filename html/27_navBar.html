<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        padding: 0;
        margin: 0;
        font-family: Georgia;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        background-color: #595859;
        padding: 2px 10px;
      }

      .webName {
        color: white;
        margin-top: 18px;
        font-weight: bold;
      }

      .nav-links {
        list-style: none;
        display: flex;
        margin-top: 18px;
        gap: 10px;
      }

      .nav-links li a {
        color: white;
        text-decoration: none;
      }

      .nav-links li a:hover {
        text-decoration: underline;
      }

      .user-logo {
        height: 50px;
        width: 50px;
        border-radius: 50%;
      }

      .container {
        display: flex;
        justify-content: space-evenly;
        background-color: wheat;
        /* height: 200px; */
        padding: 10px;
      }

      .box {
        height: 150px;
        width: 30%;
        background-color: dodgerblue;
        color: white;
        text-align: center;
        align-content: center;
        align-items: center;
        border-radius: 10px;
        transition: all 0.5s ease;
      }

      .box:hover {
        background-color: rgb(12, 131, 249);
        transform: translateY(-5px);
      }

      .burger-menu {
        font-size: larger;
        color: white;
        margin-top: 16px;
        cursor: pointer;
        display: none;
      }

      /* MEDIA QUERY */
      @media screen and (max-width: 500px) {
        .burger-menu {
          display: block;
        }

        .nav-links {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="navbar">
      <div class="webName">Learning Portal</div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
      <div class="user-img">
        <img
          src="https://cdn-icons-png.flaticon.com/512/9187/9187604.png"
          alt="userLogo"
          class="user-logo"
        />
      </div>
      <div class="burger-menu">
        <i class="fa-solid fa-bars"></i>
      </div>
    </div>
    <div class="container">
      <div class="box">Course A</div>
      <div class="box">Course B</div>
      <div class="box">Course C</div>
    </div>
  </body>
</html>
