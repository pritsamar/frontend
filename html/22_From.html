<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Registration Form</h1>
    <label for="firstname">FirstName:</label>
    <input type="text" id="firstname" /> <br />
    <label for="LastName">LastName:</label>
    <input type="text" id="LastName" /> <br />
    <label for="Email">Email:</label>
    <input type="email" id="Email" /> <br />
    <label for="password">password:</label>
    <input type="password" id="password" /> <br />

    <label for="gender">Gender</label><br />
    <input type="radio" name="gender" id="male" /> <label for="male">Male</label
    ><br />
    <input type="radio" name="gender" id="Female" />
    <label for="Female">Female</label><br />
    <input type="radio" name="gender" id="Others" />
    <label for="Others">Others</label><br />

    <label for="age">Age:</label>
    <input type="number" name="" id="age" />
    <label for="ckbox"> Preferences: </label><br />
    <label for="acr">Acrylic Painting</label>
    <input type="checkbox" name="" id="arc" /><br />
    <label for="oil">Oil Painting</label>
    <input type="checkbox" name="" id="oil" /><br />
    <label for="water">Water Color Painting</label>
    <input type="checkbox" name="" id="water" /> <br />

    <label for="">Select Occupation</label>
    <select name="job" id="">
      <option value="" selected>Student</option>
      <option value="">painter</option>
      <option value="">professional</option>
    </select>
    <br />
    <label for="">Bio</label>
    <textarea name="" id="" rows="10" cols="100"></textarea>
  </body>
</html>
